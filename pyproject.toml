[project]
name = "data-pipeline"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "pandas",
    "pandas-stubs",
    "pytest",
    "sqlalchemy",
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.scripts]
etl-pipeline = "etl_utils.cli:main"
